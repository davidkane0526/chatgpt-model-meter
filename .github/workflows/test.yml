name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run regression tests
        run: npm test
      - name: Build extension ZIP
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          zip -9 -j dist/chatgpt-model-meter-v0.9.0.zip \
            manifest.json \
            bridge.js \
            model.js \
            model-labels.js \
            model-ui.js \
            widget.js \
            resilience.js \
            README.md
      - name: Upload tested extension
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-model-meter-v0.9.0
          path: dist/chatgpt-model-meter-v0.9.0.zip
          if-no-files-found: error
          retention-days: 30
